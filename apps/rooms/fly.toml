# Fly.io config for the room server. Deploy from the repo root:
#   fly deploy --config apps/rooms/fly.toml --dockerfile apps/rooms/Dockerfile
# Secrets (fly secrets set ...): ROOMS_JWT_SECRET, DATABASE_URL, ALLOWED_ORIGINS,
#   OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY, TAVILY_API_KEY, MEM0_API_KEY, MOZAIK_API_KEY
app = "quorum-rooms"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 4000
  force_https = true
  # Rooms are live, in-memory state: never stop a machine that may hold one.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 4000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
