# Local development services. Production uses managed Postgres (Neon).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
      POSTGRES_DB: quorum
    ports:
      - "54329:5432"
    volumes:
      - quorum-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  quorum-pg:
